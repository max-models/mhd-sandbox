name: Docs

# The Astro + Starlight site in docs/: hand-written pages, the executed notebooks and the API
# reference. Built on every push and pull request with the shared workflow of
# max-models/starlight-theme; deployed to GitHub Pages from devel.

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.2.0
    with:
      pre-build: uv run python docs/tools/examples.py
      smoke-paths: |
        getting-started/installation/index.html
        tutorials/index.html
        tutorials/orszag-tang/index.html
        tutorials/test-problems/index.html
        tutorials/multifluid/index.html
        full-examples/index.html
        full-examples/orszag-tang/index.html
        api/mhd_sandbox/index.html
        api/mhd_sandbox/solver/index.html
        tutorials/orszag-tang/orszag_tang.ipynb
        full-examples/orszag-tang/plot-1.png
